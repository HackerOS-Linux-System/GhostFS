# /etc/calamares/modules/ghostfs-mkfs.conf
#
# HackerOS ships with GhostFS as the ONLY root filesystem option — there is
# no ext4/btrfs fallback in this installer configuration (see
# partition.conf.ghostfs-patch.yaml + settings.conf.ghostfs sequence).
#
# cybersecMode is therefore always true here: HackerOS installs are expected
# to be encrypted by default. A random 256-bit key is minted during install
# and stored at keyDir/keyFilename inside the target system; the user can
# switch to a typed passphrase or TPM-sealed key after first boot with
# `ghostfs-admin.sh` / `ghostfs tpm-seal-key` (see README "Post-install
# hardening").
---
ghostfsBin:   "/usr/local/bin/ghostfs-cybersec"
compression:  "zstd"
cybersecMode: true
keyDir:       "/etc/ghostfs"
keyFilename:  "key.hex"
blockSize:    4096
